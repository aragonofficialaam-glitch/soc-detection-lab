title: Member Added to Domain Admins
id: 4e8a1c6f-2d9b-4f3a-b7e5-8c2d6a9f1e37
name: member_added_to_domain_admins
status: experimental
description: A member was added to the Domain Admins group (4728, group SID ending in -512). Identified by SID instead of name so it works in any Windows language.
author: Aragon
date: 2026-10-29
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4728
        TargetSid|endswith: '-512'
    condition: selection
level: high
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1098.007
---
title: New Domain Admin Member Shortly After Account Creation
id: 9a1d4f6e-3c7b-4e2a-8f5d-2b6a9c1e4f7d
status: experimental
description: Detects a newly created account being added to Domain Admins within 1 hour. The account is matched by SID (TargetSid in 4720 = MemberSid in 4728). Indicates privilege escalation or attacker persistence.
references:
    - https://attack.mitre.org/techniques/T1136/002/
    - https://attack.mitre.org/techniques/T1098/007/
author: Aragon
date: 2026-10-20
modified: 2026-10-29
correlation:
    type: temporal_ordered
    rules:
        - new_user_account_created
        - member_added_to_domain_admins
    aliases:
        new_account_sid:
            new_user_account_created: TargetSid
            member_added_to_domain_admins: MemberSid
    group-by:
        - new_account_sid
    timespan: 1h
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1136.002
    - attack.t1098.007
falsepositives:
    - Legitimate onboarding of a new administrator (must match an approved change ticket)
level: critical