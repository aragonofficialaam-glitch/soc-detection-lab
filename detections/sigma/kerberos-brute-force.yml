title: Multiple Kerberos Password Failures for One Account
id: 2d7c5a1e-8f4b-4b9a-b3e6-0a9f1d6c4e75
name: kerberos_multiple_password_failures
status: experimental
description: Same source failed Kerberos pre-authentication 5 or more times for the same account within 5 minutes.
author: Aragon
date: 2026-10-21
correlation:
    type: event_count
    rules:
        - kerberos_preauth_wrong_password
    group-by:
        - TargetUserName
        - IpAddress
    timespan: 5m
    condition:
        gte: 5
level: medium
---
title: Kerberos Password Brute Force Followed by Successful Logon
id: 4b2e7f1a-9c3d-4a6e-8b2f-1d5c7e9a3f4b
status: experimental
description: Detects repeated Kerberos pre-authentication failures (4771, 0x18) for one account from one source, followed by a successful TGT request (4768) for the same account and source. Indicates a successful password guessing attack.
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: Aragon
date: 2026-10-21
correlation:
    type: temporal_ordered
    rules:
        - kerberos_multiple_password_failures
        - kerberos_tgt_success
    group-by:
        - TargetUserName
        - IpAddress
    timespan: 10m
tags:
    - attack.credential_access
    - attack.t1110.001
falsepositives:
    - User who changed their password while a device (phone, mapped drive) keeps retrying the old one, then the user logs in normally
level: high