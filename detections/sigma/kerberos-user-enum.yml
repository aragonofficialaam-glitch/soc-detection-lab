name: Validate Sigma Rules

on:
  push:
    paths:
      - 'detections/sigma/**.yml'
  pull_request:
    paths:
      - 'detections/sigma/**.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate Sigma rule syntax and required fields
        run: |
          python3 - <<'EOF'
          import yaml
          import glob
          import sys

          files = glob.glob('detections/sigma/*.yml')

          if not files:
              print("FAIL: No Sigma rule files found in detections/sigma/")
              sys.exit(1)

          failed = False

          for file in files:
              try:
                  with open(file, 'r') as f:
                      docs = list(yaml.safe_load_all(f))

                  if not docs:
                      print(f"FAIL: {file} - empty file")
                      failed = True
                      continue

                  for i, doc in enumerate(docs):
                      is_correlation = isinstance(doc, dict) and 'correlation' in doc
                      required = ['title', 'id', 'correlation'] if is_correlation else ['title', 'detection', 'logsource']
                      missing = [field for field in required if field not in doc]

                      if missing:
                          print(f"FAIL: {file} (document {i}) - missing required fields: {missing}")
                          failed = True
                      else:
                          print(f"OK: {file} (document {i})")

              except yaml.YAMLError as e:
                  print(f"FAIL: {file} - invalid YAML syntax: {e}")
                  failed = True

          if failed:
              sys.exit(1)
          else:
              print(f"\nAll Sigma rule files validated successfully ({len(files)} files).")
          EOF