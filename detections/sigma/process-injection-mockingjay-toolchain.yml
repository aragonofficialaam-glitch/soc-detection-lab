title: Known RWX Process Injection Tool Execution (MockingJay-style)
id: 1f6a3c9e-8b4d-4e2f-9c7a-5d8b2e4f1a6c
status: experimental
description: IOC-based rule. Detects execution of the RWX-section injection tools used in lab testing (searchVuln.exe, RWXinjectionLocal.exe) by file name OR SHA256 hash, so renaming the binaries does not bypass it. The MockingJay technique evaded Sysmon events 8 and 10 in the lab; the behavior is covered separately by the msys-2.0.dll image load rule.
references:
    - https://attack.mitre.org/techniques/T1055/
    - https://www.securityjoes.com/post/process-mockingjay-echoing-rwx-in-userland-to-achieve-code-execution
author: Aragon
date: 2026-10-24
modified: 2026-10-29
logsource:
    product: windows
    category: process_creation
detection:
    selection_name:
        Image|endswith:
            - '\searchVuln.exe'
            - '\RWXinjectionLocal.exe'
    selection_hash:
        Hashes|contains:
            - 'SHA256=CCC35F62AC59A13E5FFB7DBB8AB048A254BFFB860CACBF5D50DF8F456FF1B27B'
            - 'SHA256=80427D66932BD8B6C49741EB68D2FB6CDA729B33F01DA96ED25D5CB61A7A58F9'
    condition: 1 of selection_*
level: high
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1055
falsepositives:
    - None expected; hashes belong to lab attack tools