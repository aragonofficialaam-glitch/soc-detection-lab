title: Remote Command Execution via Task Scheduler (ATSVC) as SYSTEM
id: 2e8f4a1c-6b9d-4f3e-a7c1-5d2e9b4f8a6c
status: experimental
description: Detects cmd.exe launched by the Task Scheduler service (svchost -s Schedule) as SYSTEM (LogonId 0x3e7, language-independent) with output redirected to Windows\Temp using 2>&1. This matches the pattern of Impacket atexec.py remote execution.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Aragon
date: 2026-10-20
modified: 2026-10-29
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\cmd.exe'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
        LogonId: '0x3e7'
        CommandLine|contains|all:
            - 'Windows\Temp\'
            - '2>&1'
    condition: selection
level: high
tags:
    - attack.execution
    - attack.persistence
    - attack.t1053.005
falsepositives:
    - Legitimate SYSTEM scheduled tasks that redirect output to Windows\Temp (rare; allowlist by task)