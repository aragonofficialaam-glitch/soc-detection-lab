title: Potential DCSync Attack (Directory Replication Rights Abuse)
id: 6c4e8b2a-1f9d-4a7e-9c3b-8e5a2d6f1c4b
status: experimental
description: Detects a non-computer account using Directory Replication Service rights (Replicating Directory Changes, Changes All, or Changes In Filtered Set) on the domain object. These rights are normally used only by Domain Controllers; a user account using them indicates DCSync credential dumping (e.g. Mimikatz lsadump::dcsync, Impacket secretsdump).
references:
    - https://attack.mitre.org/techniques/T1003/006/
author: Aragon
date: 2026-10-20
modified: 2026-10-29
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4662
        AccessMask: '0x100'
        Properties|contains:
            - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
            - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
            - '89e95b76-444d-4c62-991a-0facbeda640c'
    filter_computer_accounts:
        SubjectUserName|endswith: '$'
    condition: selection and not filter_computer_accounts
level: critical
tags:
    - attack.credential_access
    - attack.t1003.006
falsepositives:
    - Azure AD Connect (MSOL_ accounts) or backup tools explicitly granted replication rights (allowlist by account)