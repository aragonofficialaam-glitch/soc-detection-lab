title: Registry Run Key Modification for Persistence via reg.exe
id: 9e4f2c8a-5d1b-4e7f-8a3c-6b9d2e5f1a8c
status: experimental
description: Detects reg.exe (including renamed copies) adding a value to a Run or RunOnce key in HKCU or HKLM, used to make malware start automatically at logon. Does not depend on the parent process.
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Aragon
date: 2026-10-24
modified: 2026-10-29
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\reg.exe'
        - OriginalFileName: 'reg.exe'
    selection_cli:
        CommandLine|contains|all:
            - ' add '
            - '\CurrentVersion\Run'
    condition: all of selection_*
level: medium
tags:
    - attack.persistence
    - attack.t1547.001
falsepositives:
    - Software installers or admin scripts adding startup entries (verify against known software deployment)