title: Local Scheduled Task Creation for Persistence
id: 3c7a9f2e-6b1d-4e8a-9f3c-7d2e5a8b1c4f
status: experimental
description: Detects creation of a local scheduled task via schtasks.exe spawned from cmd.exe, a common technique for establishing persistence on a compromised host.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Aragon
date: 2026-10-24
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/Create'
        ParentImage|endswith: '\cmd.exe'
    condition: selection
level: medium
tags:
    - attack.persistence
    - attack.t1053.005
falsepositives:
    - Legitimate IT administration creating scheduled tasks via script (should correlate with a known admin account and change ticket)
