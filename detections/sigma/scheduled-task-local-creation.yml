title: Local Scheduled Task Creation for Persistence
id: 3c7a9f2e-6b1d-4e8a-9f3c-7d2e5a8b1c4f
status: experimental
description: Detects creation of a scheduled task with schtasks.exe (including renamed copies), regardless of the parent process. Common technique to establish persistence on a compromised host.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Aragon
date: 2026-10-24
modified: 2026-10-29
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\schtasks.exe'
        - OriginalFileName: 'schtasks.exe'
    selection_cli:
        CommandLine|contains|windash: ' -create '
    condition: all of selection_*
level: medium
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
falsepositives:
    - IT administration scripts creating tasks (verify against admin account and change ticket)